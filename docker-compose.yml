services:
  minio:
    image: minio/minio:latest
    container_name: minio_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  create-bucket:
    image: minio/mc:latest
    container_name: cultural-influence-minio-setup
    depends_on:
      - minio
    volumes:
      - ./media:/media:ro
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 root rootpassword; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/cultural-excerpts;
      /usr/bin/mc anonymous set download local/cultural-excerpts;
      /usr/bin/mc cp --recursive /media/ local/cultural-excerpts/;
      exit 0;
      "

volumes:
  minio-data:
