<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>Культурный след — добавление отрывка</title>
  <desc>Редактируемый мобильный макет формы единственного черновика без отправки данных.</desc>
  <defs>
    <linearGradient id="draft-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C3C3C"/>
      <stop offset="1" stop-color="#ED2324" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="draft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#3C3C3C" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g id="screen">
    <rect width="390" height="844" fill="#FFFFFF"/>

    <g id="header">
      <rect width="390" height="94" fill="#FFFFFF"/>
      <text x="20" y="30" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">КУЛЬТУРНЫЙ СЛЕД</text>
      <text x="20" y="64" fill="#3C3C3C" font-family="Georgia, serif" font-size="28" font-weight="700">Добавление отрывка</text>
      <rect x="20" y="86" width="78" height="4" rx="2" fill="#ED2324"/>
    </g>

    <g id="draft-card" filter="url(#draft-shadow)">
      <rect x="16" y="104" width="358" height="652" rx="18" fill="#FFFFFF"/>
      <g id="media-preview">
        <rect x="28" y="116" width="334" height="146" rx="12" fill="url(#draft-cover)"/>
        <circle cx="195" cy="174" r="25" fill="#FFFFFF" opacity="0.94"/>
        <path d="M189 162h12v24h-12zM183 168h24v12h-24z" fill="#ED2324"/>
        <text x="195" y="222" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="700">Изображение и видео</text>
        <text x="195" y="241" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="11" opacity="0.84">предпросмотр материалов</text>
      </g>

      <g id="title-field">
        <text x="28" y="329" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700">НАЗВАНИЕ ПРОИЗВЕДЕНИЯ</text>
        <rect x="28" y="340" width="334" height="44" rx="8" fill="#FFFFFF" stroke="#3C3C3C" stroke-opacity="0.28"/>
        <text x="42" y="367" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="14">Фауст</text>
      </g>

      <g id="author-field">
        <text x="28" y="411" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700">АВТОР ИЛИ СЦЕНАРИСТ</text>
        <rect x="28" y="422" width="216" height="44" rx="8" fill="#FFFFFF" stroke="#3C3C3C" stroke-opacity="0.28"/>
        <text x="42" y="449" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="14">Иоганн Вольфганг фон Гёте</text>
      </g>

      <g id="year-field">
        <text x="258" y="411" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700">ГОД</text>
        <rect x="258" y="422" width="104" height="44" rx="8" fill="#FFFFFF" stroke="#3C3C3C" stroke-opacity="0.28"/>
        <text x="272" y="449" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="14">1808</text>
      </g>

      <g id="excerpt-field">
        <text x="28" y="493" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700">ТЕКСТ ОТРЫВКА</text>
        <rect x="28" y="504" width="334" height="108" rx="8" fill="#FFFFFF" stroke="#3C3C3C" stroke-opacity="0.28"/>
        <text x="42" y="533" fill="#3C3C3C" font-family="Georgia, serif" font-size="14">«Лишь тот достоин жизни и свободы,</text>
        <text x="42" y="555" fill="#3C3C3C" font-family="Georgia, serif" font-size="14">кто каждый день за них идёт на бой»</text>
      </g>

      <g id="object-keys">
        <text x="28" y="642" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700">МЕДИАФАЙЛЫ В MINIO</text>
        <rect x="28" y="653" width="334" height="34" rx="7" fill="#3C3C3C" opacity="0.06"/>
        <text x="40" y="674" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11">faust.jpg · faust.mp4</text>
      </g>
    </g>

    <g id="bottom-navigation">
      <rect x="0" y="772" width="390" height="72" fill="#FFFFFF"/>
      <rect x="0" y="772" width="390" height="1" fill="#3C3C3C" opacity="0.14"/>
      <g id="nav-feed">
        <path d="M52 797l10-8 10 8v12H65v-8h-6v8h-7Z" fill="#3C3C3C"/>
        <text x="62" y="828" text-anchor="middle" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11">Лента</text>
      </g>
      <g id="nav-add">
        <circle cx="195" cy="799" r="11" fill="#ED2324"/>
        <path d="M190 799h10M195 794v10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <text x="195" y="828" text-anchor="middle" fill="#ED2324" font-family="Arial, sans-serif" font-size="11" font-weight="700">Добавить</text>
      </g>
      <g id="nav-gallery">
        <rect x="316" y="789" width="8" height="8" rx="1" fill="none" stroke="#3C3C3C" stroke-width="1.8"/>
        <rect x="327" y="789" width="8" height="8" rx="1" fill="none" stroke="#3C3C3C" stroke-width="1.8"/>
        <rect x="316" y="800" width="8" height="8" rx="1" fill="none" stroke="#3C3C3C" stroke-width="1.8"/>
        <rect x="327" y="800" width="8" height="8" rx="1" fill="none" stroke="#3C3C3C" stroke-width="1.8"/>
        <text x="326" y="828" text-anchor="middle" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11">Плитка</text>
      </g>
    </g>
  </g>
</svg>
