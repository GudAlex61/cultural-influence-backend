<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>Культурный след — лента отрывков</title>
  <desc>Редактируемый мобильный макет экрана с видео, сведениями о произведении, лайками и переходом к следующей записи.</desc>
  <defs>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C3C3C"/>
      <stop offset="0.55" stop-color="#3C3C3C" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ED2324" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.38" stop-color="#3C3C3C" stop-opacity="0"/>
      <stop offset="1" stop-color="#3C3C3C" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#3C3C3C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g id="screen">
    <rect width="390" height="844" fill="#FFFFFF"/>

    <g id="header">
      <rect width="390" height="88" fill="#FFFFFF"/>
      <text x="20" y="30" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">КУЛЬТУРНЫЙ СЛЕД</text>
      <text x="20" y="64" fill="#3C3C3C" font-family="Georgia, serif" font-size="28" font-weight="700">Лента отрывков</text>
      <circle cx="354" cy="44" r="17" fill="#ED2324"/>
      <path d="M347 44h14M354 37v14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <rect x="20" y="87" width="350" height="1" fill="#3C3C3C" opacity="0.14"/>
    </g>

    <g id="video-card" filter="url(#shadow)">
      <rect x="16" y="104" width="358" height="652" rx="18" fill="url(#poster)"/>
      <circle cx="95" cy="211" r="78" fill="#FFFFFF" opacity="0.07"/>
      <circle cx="297" cy="277" r="118" fill="#ED2324" opacity="0.13"/>
      <path d="M42 510C92 440 121 399 176 378C221 361 278 372 350 421V606H42Z" fill="#FFFFFF" opacity="0.07"/>
      <text x="42" y="150" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">ВИДЕО • ЛИТЕРАТУРА</text>
      <rect x="42" y="163" width="54" height="3" rx="1.5" fill="#ED2324"/>

      <g id="play-indicator">
        <circle cx="195" cy="331" r="31" fill="#FFFFFF" opacity="0.92"/>
        <path d="M189 318L211 331L189 344Z" fill="#ED2324"/>
      </g>

      <rect x="16" y="104" width="358" height="652" rx="18" fill="url(#shade)"/>

      <g id="like">
        <circle cx="334" cy="507" r="24" fill="#FFFFFF"/>
        <path d="M334 519C331 515 322 509 322 502C322 495 331 493 334 499C337 493 346 495 346 502C346 509 337 515 334 519Z" fill="#ED2324"/>
        <text x="334" y="542" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700">128</text>
      </g>

      <g id="content">
        <text x="40" y="534" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">Ф. М. ДОСТОЕВСКИЙ • 1866</text>
        <text x="40" y="570" fill="#FFFFFF" font-family="Georgia, serif" font-size="27" font-weight="700">Преступление</text>
        <text x="40" y="601" fill="#FFFFFF" font-family="Georgia, serif" font-size="27" font-weight="700">и наказание</text>
        <text x="40" y="632" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">«Тварь ли я дрожащая</text>
        <text x="40" y="653" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">или право имею?»</text>
        <text x="40" y="681" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="700">Больше  ↓</text>
      </g>

      <g id="next-button">
        <rect x="40" y="702" width="294" height="42" rx="21" fill="#ED2324"/>
        <text x="187" y="728" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700">Следующий отрывок</text>
        <path d="M306 719l5 5-5 5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <g id="bottom-navigation">
      <rect x="0" y="772" width="390" height="72" fill="#FFFFFF"/>
      <rect x="0" y="772" width="390" height="1" fill="#3C3C3C" opacity="0.14"/>
      <g id="nav-feed">
        <path d="M52 797l10-8 10 8v12H65v-8h-6v8h-7Z" fill="#ED2324"/>
        <text x="62" y="828" text-anchor="middle" fill="#ED2324" font-family="Arial, sans-serif" font-size="11" font-weight="700">Лента</text>
      </g>
      <g id="nav-add">
        <circle cx="195" cy="799" r="11" fill="none" stroke="#3C3C3C" stroke-width="2"/>
        <path d="M190 799h10M195 794v10" stroke="#3C3C3C" stroke-width="2" stroke-linecap="round"/>
        <text x="195" y="828" text-anchor="middle" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11">Добавить</text>
      </g>
      <g id="nav-gallery">
        <rect x="316" y="789" width="8" height="8" rx="1" fill="none" stroke="#3C3C3C" stroke-width="1.8"/>
        <rect x="327" y="789" width="8" height="8" rx="1" fill="none" stroke="#3C3C3C" stroke-width="1.8"/>
        <rect x="316" y="800" width="8" height="8" rx="1" fill="none" stroke="#3C3C3C" stroke-width="1.8"/>
        <rect x="327" y="800" width="8" height="8" rx="1" fill="none" stroke="#3C3C3C" stroke-width="1.8"/>
        <text x="326" y="828" text-anchor="middle" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11">Плитка</text>
      </g>
    </g>
  </g>
</svg>
