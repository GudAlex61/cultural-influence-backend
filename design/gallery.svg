<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>Культурный след — плитка произведений</title>
  <desc>Редактируемый мобильный макет двухколоночной галереи с GET-фильтром по году публикации.</desc>
  <defs>
    <linearGradient id="cover-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C3C3C"/>
      <stop offset="1" stop-color="#ED2324" stop-opacity="0.74"/>
    </linearGradient>
    <filter id="gallery-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3C3C3C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g id="screen">
    <rect width="390" height="844" fill="#FFFFFF"/>

    <g id="header">
      <rect width="390" height="90" fill="#FFFFFF"/>
      <text x="20" y="30" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">КУЛЬТУРНЫЙ СЛЕД</text>
      <text x="20" y="64" fill="#3C3C3C" font-family="Georgia, serif" font-size="28" font-weight="700">Отрывки произведений</text>
    </g>

    <g id="year-filter">
      <rect x="16" y="96" width="358" height="76" rx="12" fill="#3C3C3C" opacity="0.06"/>
      <text x="28" y="119" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700">ФИЛЬТР ПО ГОДУ ПУБЛИКАЦИИ</text>
      <rect x="28" y="130" width="219" height="32" rx="6" fill="#FFFFFF" stroke="#3C3C3C" stroke-opacity="0.22"/>
      <text x="40" y="151" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="13">1866</text>
      <rect x="255" y="130" width="107" height="32" rx="16" fill="#ED2324"/>
      <text x="309" y="151" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700">Показать</text>
    </g>

    <g id="card-crime" filter="url(#gallery-shadow)">
      <rect x="16" y="220" width="171" height="246" rx="12" fill="#FFFFFF"/>
      <rect x="16" y="220" width="171" height="142" rx="12" fill="url(#cover-a)"/>
      <path d="M33 334L75 268L113 326L141 286L174 334Z" fill="#FFFFFF" opacity="0.11"/>
      <text x="28" y="388" fill="#3C3C3C" font-family="Georgia, serif" font-size="16" font-weight="700">Преступление</text>
      <text x="28" y="407" fill="#3C3C3C" font-family="Georgia, serif" font-size="16" font-weight="700">и наказание</text>
      <text x="28" y="438" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11">1866</text>
      <text x="175" y="438" text-anchor="end" fill="#ED2324" font-family="Arial, sans-serif" font-size="11" font-weight="700">♥ 5</text>
    </g>

    <g id="bottom-navigation">
      <rect x="0" y="772" width="390" height="72" fill="#FFFFFF"/>
      <rect x="0" y="772" width="390" height="1" fill="#3C3C3C" opacity="0.14"/>
      <g id="nav-feed">
        <path d="M52 797l10-8 10 8v12H65v-8h-6v8h-7Z" fill="#3C3C3C"/>
        <text x="62" y="828" text-anchor="middle" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11">Лента</text>
      </g>
      <g id="nav-add">
        <circle cx="195" cy="799" r="11" fill="none" stroke="#3C3C3C" stroke-width="2"/>
        <path d="M190 799h10M195 794v10" stroke="#3C3C3C" stroke-width="2" stroke-linecap="round"/>
        <text x="195" y="828" text-anchor="middle" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11">Добавить</text>
      </g>
      <g id="nav-gallery">
        <rect x="316" y="789" width="8" height="8" rx="1" fill="#ED2324"/>
        <rect x="327" y="789" width="8" height="8" rx="1" fill="#ED2324"/>
        <rect x="316" y="800" width="8" height="8" rx="1" fill="#ED2324"/>
        <rect x="327" y="800" width="8" height="8" rx="1" fill="#ED2324"/>
        <text x="326" y="828" text-anchor="middle" fill="#ED2324" font-family="Arial, sans-serif" font-size="11" font-weight="700">Плитка</text>
      </g>
    </g>
  </g>
</svg>
