<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>Культурный след — плитка произведений</title>
  <desc>Редактируемый мобильный макет двухколоночной галереи с GET-фильтром по году публикации.</desc>
  <defs>
    <linearGradient id="cover-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C3C3C"/>
      <stop offset="1" stop-color="#ED2324" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="cover-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C3C3C" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#3C3C3C"/>
    </linearGradient>
    <filter id="gallery-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3C3C3C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g id="screen">
    <rect width="390" height="844" fill="#FFFFFF"/>

    <g id="header">
      <rect width="390" height="90" fill="#FFFFFF"/>
      <text x="20" y="30" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">КУЛЬТУРНЫЙ СЛЕД</text>
      <text x="20" y="64" fill="#3C3C3C" font-family="Georgia, serif" font-size="28" font-weight="700">Произведения</text>
      <circle cx="354" cy="44" r="17" fill="#ED2324"/>
      <path d="M347 44h14M354 37v14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g id="year-filter">
      <rect x="16" y="96" width="358" height="76" rx="12" fill="#3C3C3C" opacity="0.06"/>
      <text x="28" y="119" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700">ФИЛЬТР ПО ГОДУ ПУБЛИКАЦИИ</text>
      <rect x="28" y="130" width="219" height="32" rx="6" fill="#FFFFFF" stroke="#3C3C3C" stroke-opacity="0.22"/>
      <text x="40" y="151" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="13">1866</text>
      <rect x="255" y="130" width="107" height="32" rx="16" fill="#ED2324"/>
      <text x="309" y="151" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700">Показать</text>
    </g>

    <g id="results-label">
      <text x="20" y="204" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">НАЙДЕНО: 4</text>
      <rect x="105" y="197" width="265" height="1" fill="#3C3C3C" opacity="0.14"/>
    </g>

    <g id="card-crime" filter="url(#gallery-shadow)">
      <rect x="16" y="220" width="171" height="246" rx="12" fill="#FFFFFF"/>
      <rect x="16" y="220" width="171" height="142" rx="12" fill="url(#cover-a)"/>
      <path d="M33 334L75 268L113 326L141 286L174 334Z" fill="#FFFFFF" opacity="0.11"/>
      <text x="30" y="246" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">РОМАН</text>
      <circle cx="158" cy="338" r="14" fill="#ED2324"/>
      <path d="M158 345C156 342 151 339 151 335C151 331 156 330 158 333C160 330 165 331 165 335C165 339 160 342 158 345Z" fill="#FFFFFF"/>
      <text x="28" y="388" fill="#3C3C3C" font-family="Georgia, serif" font-size="16" font-weight="700">Преступление</text>
      <text x="28" y="407" fill="#3C3C3C" font-family="Georgia, serif" font-size="16" font-weight="700">и наказание</text>
      <text x="28" y="428" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="10">Ф. М. Достоевский • 1866</text>
      <text x="28" y="450" fill="#ED2324" font-family="Arial, sans-serif" font-size="11" font-weight="700">♥ 128 отметок</text>
    </g>

    <g id="card-war" filter="url(#gallery-shadow)">
      <rect x="203" y="220" width="171" height="246" rx="12" fill="#FFFFFF"/>
      <rect x="203" y="220" width="171" height="142" rx="12" fill="url(#cover-b)"/>
      <circle cx="250" cy="278" r="32" fill="#FFFFFF" opacity="0.08"/>
      <path d="M218 335C249 292 292 274 359 306V362H218Z" fill="#ED2324" opacity="0.27"/>
      <text x="217" y="246" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">РОМАН-ЭПОПЕЯ</text>
      <circle cx="345" cy="338" r="14" fill="#ED2324"/>
      <path d="M345 345C343 342 338 339 338 335C338 331 343 330 345 333C347 330 352 331 352 335C352 339 347 342 345 345Z" fill="#FFFFFF"/>
      <text x="215" y="388" fill="#3C3C3C" font-family="Georgia, serif" font-size="16" font-weight="700">Война и мир</text>
      <text x="215" y="428" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="10">Лев Толстой • 1869</text>
      <text x="215" y="450" fill="#ED2324" font-family="Arial, sans-serif" font-size="11" font-weight="700">♥ 94 отметки</text>
    </g>

    <g id="card-master" filter="url(#gallery-shadow)">
      <rect x="16" y="480" width="171" height="246" rx="12" fill="#FFFFFF"/>
      <rect x="16" y="480" width="171" height="142" rx="12" fill="url(#cover-b)"/>
      <circle cx="119" cy="537" r="43" fill="#ED2324" opacity="0.40"/>
      <path d="M28 597L70 551L95 586L120 558L176 608V622H28Z" fill="#FFFFFF" opacity="0.10"/>
      <text x="30" y="506" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">РОМАН</text>
      <circle cx="158" cy="598" r="14" fill="#ED2324"/>
      <path d="M158 605C156 602 151 599 151 595C151 591 156 590 158 593C160 590 165 591 165 595C165 599 160 602 158 605Z" fill="#FFFFFF"/>
      <text x="28" y="648" fill="#3C3C3C" font-family="Georgia, serif" font-size="16" font-weight="700">Мастер</text>
      <text x="28" y="667" fill="#3C3C3C" font-family="Georgia, serif" font-size="16" font-weight="700">и Маргарита</text>
      <text x="28" y="688" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="10">Михаил Булгаков • 1967</text>
      <text x="28" y="710" fill="#ED2324" font-family="Arial, sans-serif" font-size="11" font-weight="700">♥ 211 отметок</text>
    </g>

    <g id="card-hamlet" filter="url(#gallery-shadow)">
      <rect x="203" y="480" width="171" height="246" rx="12" fill="#FFFFFF"/>
      <rect x="203" y="480" width="171" height="142" rx="12" fill="url(#cover-a)"/>
      <circle cx="288" cy="552" r="46" fill="#FFFFFF" opacity="0.09"/>
      <path d="M253 600C257 568 270 548 288 548C306 548 319 568 323 600Z" fill="#3C3C3C" opacity="0.54"/>
      <text x="217" y="506" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">ТРАГЕДИЯ</text>
      <circle cx="345" cy="598" r="14" fill="#ED2324"/>
      <path d="M345 605C343 602 338 599 338 595C338 591 343 590 345 593C347 590 352 591 352 595C352 599 347 602 345 605Z" fill="#FFFFFF"/>
      <text x="215" y="648" fill="#3C3C3C" font-family="Georgia, serif" font-size="16" font-weight="700">Гамлет</text>
      <text x="215" y="688" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="10">У. Шекспир • 1600</text>
      <text x="215" y="710" fill="#ED2324" font-family="Arial, sans-serif" font-size="11" font-weight="700">♥ 176 отметок</text>
    </g>

    <g id="bottom-navigation">
      <rect x="0" y="772" width="390" height="72" fill="#FFFFFF"/>
      <rect x="0" y="772" width="390" height="1" fill="#3C3C3C" opacity="0.14"/>
      <g id="nav-feed">
        <path d="M52 797l10-8 10 8v12H65v-8h-6v8h-7Z" fill="#3C3C3C"/>
        <text x="62" y="828" text-anchor="middle" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11">Лента</text>
      </g>
      <g id="nav-add">
        <circle cx="195" cy="799" r="11" fill="none" stroke="#3C3C3C" stroke-width="2"/>
        <path d="M190 799h10M195 794v10" stroke="#3C3C3C" stroke-width="2" stroke-linecap="round"/>
        <text x="195" y="828" text-anchor="middle" fill="#3C3C3C" font-family="Arial, sans-serif" font-size="11">Добавить</text>
      </g>
      <g id="nav-gallery">
        <rect x="316" y="789" width="8" height="8" rx="1" fill="#ED2324"/>
        <rect x="327" y="789" width="8" height="8" rx="1" fill="#ED2324"/>
        <rect x="316" y="800" width="8" height="8" rx="1" fill="#ED2324"/>
        <rect x="327" y="800" width="8" height="8" rx="1" fill="#ED2324"/>
        <text x="326" y="828" text-anchor="middle" fill="#ED2324" font-family="Arial, sans-serif" font-size="11" font-weight="700">Плитка</text>
      </g>
    </g>
  </g>
</svg>
